name: BON APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Uygulama dosyalarını hazırla
        run: |
          mkdir -p icons www
          [ -f index.html ] || cat > index.html <<'EOF_INDEX'
          <!doctype html>
          <html lang="tr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
          <title>BON</title>
          <style>
            :root { --bg: #050b14; --ink: #d4f0ff; --glow: #3cc8ff; --dim: #8fb6cc; }
            html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
              font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
              -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
            video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: .32; }
            #grid { position: fixed; inset: 0; pointer-events: none;
              background-image: linear-gradient(rgba(60,200,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(60,200,255,.05) 1px, transparent 1px);
              background-size: 44px 44px; }
            canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
            #hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 22px); left: 0; right: 0; text-align: center;
              font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); pointer-events: none; padding: 0 16px; }
            #tip { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); text-align: center;
              font-size: 14px; line-height: 1.5; color: var(--ink); opacity: 0; transition: opacity .5s; pointer-events: none; }
            #tip.on { opacity: .9; }
            #reset { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); font: inherit; font-size: 14px;
              padding: 10px 18px; border-radius: 12px; border: 1px solid rgba(60,200,255,.5); background: rgba(11,43,64,.7); color: var(--ink); }
            #count { position: fixed; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 26px); font-size: 13px; color: var(--dim);
              letter-spacing: .08em; text-transform: uppercase; pointer-events: none; font-variant-numeric: tabular-nums; }

            #splash { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
              background: radial-gradient(circle at 50% 42%, #0f2c46 0%, #050b14 62%); transition: opacity .6s; padding: 24px; box-sizing: border-box; text-align: center; }
            #splash.off { opacity: 0; pointer-events: none; }
            #logo { width: 168px; height: 168px; filter: drop-shadow(0 0 26px rgba(60,200,255,.55)); }
            .half { animation-duration: 2.6s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
            .half.l { animation-name: apartL; }
            .half.r { animation-name: apartR; }
            @keyframes apartL { 0%, 100% { transform: translateX(0); } 40%, 60% { transform: translateX(-15px); } }
            @keyframes apartR { 0%, 100% { transform: translateX(0); } 40%, 60% { transform: translateX(15px); } }
            #word { font-size: 46px; font-weight: 800; letter-spacing: .32em; margin-right: -.32em; color: var(--ink); text-shadow: 0 0 22px rgba(60,200,255,.7); }
            #smsg { font-size: 14px; color: var(--dim); max-width: 320px; min-height: 40px; line-height: 1.45; }
            #bar { width: 140px; height: 3px; background: rgba(60,200,255,.18); border-radius: 3px; overflow: hidden; }
            #bar i { display: block; height: 100%; width: 40%; background: var(--glow); border-radius: 3px; animation: slide 1.2s ease-in-out infinite; }
            @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
            #retry { display: none; font: inherit; font-size: 16px; padding: 12px 26px; border-radius: 12px; border: 1px solid var(--glow); background: #0b2b40; color: var(--ink); }
            @media (prefers-reduced-motion: reduce) { .half, #bar i { animation: none; } }
          </style>
          </head>
          <body>
          <video id="v" playsinline muted autoplay></video>
          <div id="grid"></div>
          <canvas id="c"></canvas>
          <div id="hud"></div>
          <div id="tip">Parmak uçlarını değdir: tut. Aç: fırlat.<br>İki elle topu tutup ayır: böl.</div>
          <div id="count"></div>
          <button id="reset">Sıfırla</button>

          <div id="splash">
            <svg id="logo" viewBox="0 0 200 200" aria-hidden="true">
              <defs>
                <radialGradient id="bg" gradientUnits="userSpaceOnUse" cx="82" cy="76" r="96">
                  <stop offset="0" stop-color="#f2fbff"/><stop offset=".42" stop-color="#3cc8ff"/><stop offset="1" stop-color="#0b4f7a"/>
                </radialGradient>
              </defs>
              <g class="half l"><path d="M100 36 A64 64 0 0 0 100 164 Z" fill="url(#bg)"/></g>
              <g class="half r"><path d="M100 36 A64 64 0 0 1 100 164 Z" fill="url(#bg)"/></g>
            </svg>
            <div id="word">BON</div>
            <div id="smsg">Başlatılıyor...</div>
            <div id="bar"><i></i></div>
            <button id="retry">Tekrar dene</button>
          </div>

          <script>
          (function () {
            "use strict";
            var TEST = location.search.indexOf("test") >= 0;
            var $ = function (id) { return document.getElementById(id); };
            var v = $("v"), cv = $("c"), ctx = cv.getContext("2d"), hud = $("hud"), tip = $("tip"), countEl = $("count");
            var splash = $("splash"), smsg = $("smsg"), retry = $("retry"), bar = $("bar");

            var PIN_ON = 0.45, PIN_OFF = 0.72, MAX_BALLS = 10;
            var W = 0, H = 0, dpr = 1, R0 = 44;
            var balls = [], slots = [null, null], dets = [], detT = 0, fx = [];
            var last = 0;

            var LINKS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

            function newBall(x, y, r) { return { x: x, y: y, vx: 0, vy: 0, r: r, held: -1, second: -1, d0: 0, ox: 0, oy: 0, hist: [] }; }
            function reset() { balls.length = 0; balls.push(newBall(W / 2, H / 2, R0)); fx.length = 0; }

            function resize() {
              dpr = Math.min(window.devicePixelRatio || 1, 2);
              W = window.innerWidth; H = window.innerHeight;
              cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
              ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
              R0 = Math.max(34, Math.min(64, Math.min(W, H) * 0.095));
              sprites.clear();
              for (var i = 0; i < balls.length; i++) {
                balls[i].x = Math.min(Math.max(balls[i].x, balls[i].r), W - balls[i].r);
                balls[i].y = Math.min(Math.max(balls[i].y, balls[i].r), H - balls[i].r);
              }
            }

            /* ---------- top görseli (önbellekli) ---------- */
            var sprites = new Map();
            function sprite(r) {
              var k = Math.max(4, Math.round(r));
              var s = sprites.get(k);
              if (s) return s;
              if (sprites.size > 60) sprites.clear();
              var size = Math.ceil(k * 5);
              var c = document.createElement("canvas");
              c.width = Math.ceil(size * dpr); c.height = Math.ceil(size * dpr);
              var g = c.getContext("2d");
              g.scale(dpr, dpr);
              var m = size / 2;
              var glow = g.createRadialGradient(m, m, k * 0.2, m, m, k * 2.5);
              glow.addColorStop(0, "rgba(60,200,255,.5)"); glow.addColorStop(1, "rgba(60,200,255,0)");
              g.fillStyle = glow; g.beginPath(); g.arc(m, m, k * 2.5, 0, 6.2832); g.fill();
              var body = g.createRadialGradient(m - k * 0.35, m - k * 0.38, k * 0.08, m, m, k);
              body.addColorStop(0, "#f2fbff"); body.addColorStop(0.5, "#3cc8ff"); body.addColorStop(1, "#0b4f7a");
              g.fillStyle = body; g.beginPath(); g.arc(m, m, k, 0, 6.2832); g.fill();
              g.strokeStyle = "rgba(212,240,255,.75)"; g.lineWidth = 1.5; g.stroke();
              s = { c: c, size: size };
              sprites.set(k, s);
              return s;
            }

            /* ---------- el verisi ---------- */
            function feed(list, now) {
              dets = list; detT = now;
              var out = [null, null], used = [false, false], rest = [], i, d;
              for (var n = 0; n < list.length; n++) {
                d = list[n];
                var bi = -1, bd = Infinity;
                for (i = 0; i < 2; i++) {
                  var s = slots[i];
                  if (!s || used[i]) continue;
                  var dd = Math.hypot(d.x - s.tx, d.y - s.ty);
                  if (dd < bd) { bd = dd; bi = i; }
                }
                if (bi >= 0 && bd < Math.max(W, H) * 0.6) { used[bi] = true; out[bi] = d; } else rest.push(d);
              }
              for (n = 0; n < rest.length; n++) {
                for (i = 0; i < 2; i++) {
                  if (!slots[i] && !used[i]) {
                    used[i] = true; out[i] = rest[n];
                    slots[i] = { x: rest[n].x, y: rest[n].y, tx: rest[n].x, ty: rest[n].y, pinch: false, seen: now };
                    break;
                  }
                }
              }
              for (i = 0; i < 2; i++) {
                d = out[i];
                if (!d) continue;
                var sl = slots[i];
                sl.tx = d.x; sl.ty = d.y; sl.seen = now;
                sl.pinch = sl.pinch ? d.pd < PIN_OFF : d.pd < PIN_ON;
              }
            }

            function throwVel(h, now) {
              var a = [];
              for (var i = 0; i < h.length; i++) { var age = now - h[i].t; if (age <= 240 && age >= 30) a.push(h[i]); }
              if (a.length < 2) return [0, 0];
              var f = a[0], l = a[a.length - 1], dt = (l.t - f.t) / 1000;
              if (dt < 0.03) return [0, 0];
              var vx = (l.x - f.x) / dt * 1.25, vy = (l.y - f.y) / dt * 1.25;
              var sp = Math.hypot(vx, vy), cap = Math.max(W, H) * 3.5;
              if (sp > cap) { vx *= cap / sp; vy *= cap / sp; }
              if (sp < 70) return [0, 0];
              return [vx, vy];
            }

            function releaseSlot(i, now) {
              for (var n = 0; n < balls.length; n++) {
                var b = balls[n];
                if (b.second === i) b.second = -1;
                if (b.held === i) {
                  if (b.second >= 0) { b.held = b.second; b.second = -1; b.ox = 0; b.oy = 0; }
                  else {
                    var vel = throwVel(b.hist, now);
                    b.vx = vel[0]; b.vy = vel[1]; b.held = -1; b.hist = [];
                  }
                }
              }
            }

            function holdsAny(i) {
              for (var n = 0; n < balls.length; n++) if (balls[n].held === i || balls[n].second === i) return true;
              return false;
            }

            function tryGrab(i, now) {
              var s = slots[i], best = null, bd = Infinity, n, b, d;
              for (n = 0; n < balls.length; n++) {
                b = balls[n];
                if (b.held !== -1) continue;
                d = Math.hypot(b.x - s.x, b.y - s.y);
                if (d < b.r * 2 + 36 && d < bd) { bd = d; best = b; }
              }
              if (best) {
                best.held = i; best.hist = []; best.vx = 0; best.vy = 0;
                var ox = best.x - s.x, oy = best.y - s.y, m = Math.hypot(ox, oy), cap = best.r * 1.6;
                if (m > cap) { ox *= cap / m; oy *= cap / m; }
                best.ox = ox; best.oy = oy;
                return;
              }
              for (n = 0; n < balls.length; n++) {
                b = balls[n];
                if (b.held < 0 || b.held === i || b.second !== -1 || !slots[b.held]) continue;
                d = Math.hypot(b.x - s.x, b.y - s.y);
                if (d < b.r * 2.6 + 40 && d < bd) { bd = d; best = b; }
              }
              if (best) {
                best.second = i;
                best.d0 = Math.hypot(slots[best.held].x - s.x, slots[best.held].y - s.y);
              }
            }

            function split(b, i, j, now) {
              var s = slots[i], s2 = slots[j], r2 = b.r / Math.SQRT2;
              var c = newBall(s2.x, s2.y, r2);
              b.r = r2; b.x = s.x; b.y = s.y; b.ox = 0; b.oy = 0; b.held = i; b.second = -1; b.hist = [];
              c.held = j;
              balls.push(c);
              fx.push({ x: (s.x + s2.x) / 2, y: (s.y + s2.y) / 2, t: now, r: r2 * 2 });
            }

            function mergeHeld(now) {
              for (var a = 0; a < balls.length; a++) {
                for (var c = a + 1; c < balls.length; c++) {
                  var p = balls[a], q = balls[c];
                  if (p.held < 0 || q.held < 0 || p.held === q.held || p.second >= 0 || q.second >= 0) continue;
                  if (Math.hypot(p.x - q.x, p.y - q.y) < (p.r + q.r) * 0.75) {
                    p.r = Math.min(Math.sqrt(p.r * p.r + q.r * q.r), R0 * 1.5);
                    p.second = q.held;
                    p.x = (p.x + q.x) / 2; p.y = (p.y + q.y) / 2; p.ox = 0; p.oy = 0;
                    p.d0 = Math.hypot(slots[p.held].x - slots[p.second].x, slots[p.held].y - slots[p.second].y);
                    balls.splice(c, 1);
                    fx.push({ x: p.x, y: p.y, t: now, r: p.r * 2 });
                    return;
                  }
                }
              }
            }

            /* ---------- fizik ---------- */
            function update(dt, now) {
              var i, n, b, s;
              for (i = 0; i < 2; i++) {
                s = slots[i];
                if (s && now - s.seen > 200) { releaseSlot(i, now); slots[i] = null; }
              }
              var k = 1 - Math.exp(-40 * dt);
              for (i = 0; i < 2; i++) {
                s = slots[i];
                if (!s) continue;
                s.x += (s.tx - s.x) * k; s.y += (s.ty - s.y) * k;
                if (s.pinch) { if (!holdsAny(i)) tryGrab(i, now); } else releaseSlot(i, now);
              }

              var k2 = 1 - Math.exp(-60 * dt), kd = Math.exp(-10 * dt);
              var copy = balls.slice();
              for (n = 0; n < copy.length; n++) {
                b = copy[n];
                if (b.held < 0) continue;
                s = slots[b.held];
                if (!s) { b.held = -1; continue; }
                var tx = s.x + b.ox, ty = s.y + b.oy;
                if (b.second >= 0 && slots[b.second]) {
                  var s2 = slots[b.second];
                  tx = (s.x + s2.x) / 2; ty = (s.y + s2.y) / 2;
                  b.ox *= kd; b.oy *= kd;
                  var d = Math.hypot(s.x - s2.x, s.y - s2.y);
                  if (d > b.d0 + b.r * 1.2 && d > b.r * 3 && b.r > 15 && balls.length < MAX_BALLS) { split(b, b.held, b.second, now); continue; }
                }
                b.x += (tx - b.x) * k2; b.y += (ty - b.y) * k2;
                b.x = Math.min(Math.max(b.x, b.r), W - b.r); b.y = Math.min(Math.max(b.y, b.r), H - b.r);
                b.hist.push({ x: b.x, y: b.y, t: now });
                while (b.hist.length && now - b.hist[0].t > 300) b.hist.shift();
              }
              mergeHeld(now);

              var drag = Math.exp(-0.55 * dt);
              for (n = 0; n < balls.length; n++) {
                b = balls[n];
                if (b.held >= 0) continue;
                b.x += b.vx * dt; b.y += b.vy * dt;
                b.vx *= drag; b.vy *= drag;
                if (Math.hypot(b.vx, b.vy) < 8) { b.vx = 0; b.vy = 0; }
                if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * 0.85; }
                if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * 0.85; }
                if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy) * 0.85; }
                if (b.y > H - b.r) { b.y = H - b.r; b.vy = -Math.abs(b.vy) * 0.85; }
              }
              for (var a = 0; a < balls.length; a++) {
                for (var c = a + 1; c < balls.length; c++) {
                  var p = balls[a], q = balls[c];
                  if (p.held >= 0 || q.held >= 0) continue;
                  var dx = q.x - p.x, dy = q.y - p.y, dist = Math.hypot(dx, dy) || 0.01, ov = p.r + q.r - dist;
                  if (ov > 0) {
                    var nx = dx / dist, ny = dy / dist, mp = p.r * p.r, mq = q.r * q.r;
                    p.x -= nx * ov * mq / (mp + mq); p.y -= ny * ov * mq / (mp + mq);
                    q.x += nx * ov * mp / (mp + mq); q.y += ny * ov * mp / (mp + mq);
                    var rel = (q.vx - p.vx) * nx + (q.vy - p.vy) * ny;
                    if (rel < 0) {
                      var j = -(1.9) * rel / (1 / mp + 1 / mq);
                      p.vx -= j * nx / mp; p.vy -= j * ny / mp; q.vx += j * nx / mq; q.vy += j * ny / mq;
                    }
                  }
                }
              }
            }

            /* ---------- çizim ---------- */
            function drawHand(lm, pinch) {
              ctx.lineWidth = 2; ctx.lineCap = "round";
              ctx.strokeStyle = "rgba(120,220,255,.55)";
              ctx.beginPath();
              for (var i = 0; i < LINKS.length; i++) { ctx.moveTo(lm[LINKS[i][0]].x, lm[LINKS[i][0]].y); ctx.lineTo(lm[LINKS[i][1]].x, lm[LINKS[i][1]].y); }
              ctx.stroke();
              ctx.fillStyle = "rgba(212,240,255,.85)";
              for (var j = 0; j < lm.length; j++) { ctx.beginPath(); ctx.arc(lm[j].x, lm[j].y, 2.6, 0, 6.2832); ctx.fill(); }
              var px = (lm[4].x + lm[8].x) / 2, py = (lm[4].y + lm[8].y) / 2;
              ctx.beginPath(); ctx.arc(px, py, pinch ? 9 : 14, 0, 6.2832);
              ctx.strokeStyle = pinch ? "#ffffff" : "rgba(60,200,255,.9)"; ctx.lineWidth = 3; ctx.stroke();
            }

            function draw(now) {
              ctx.clearRect(0, 0, W, H);
              var fresh = now - detT < 250, i, n;
              for (n = 0; n < balls.length; n++) {
                var b = balls[n], sp = sprite(b.r), sc = b.held >= 0 ? 1.08 : 1;
                var sz = sp.size * sc;
                ctx.drawImage(sp.c, b.x - sz / 2, b.y - sz / 2, sz, sz);
              }
              for (i = fx.length - 1; i >= 0; i--) {
                var f = fx[i], age = (now - f.t) / 450;
                if (age >= 1) { fx.splice(i, 1); continue; }
                ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.6 + age * 1.6), 0, 6.2832);
                ctx.strokeStyle = "rgba(230,248,255," + (0.8 * (1 - age)).toFixed(2) + ")"; ctx.lineWidth = 3; ctx.stroke();
              }
              if (fresh) {
                for (i = 0; i < dets.length; i++) {
                  var pinch = dets[i].pd < PIN_OFF && (slots[0] || slots[1]) ? (dets[i].pd < PIN_ON) : dets[i].pd < PIN_ON;
                  drawHand(dets[i].lm, pinch);
                }
              }
            }

            function hudText() {
              var anyHand = slots[0] || slots[1], holding = false, two = false, pin = false, n;
              for (n = 0; n < balls.length; n++) { if (balls[n].held >= 0) holding = true; if (balls[n].second >= 0) two = true; }
              for (n = 0; n < 2; n++) if (slots[n] && slots[n].pinch) pin = true;
              var t = !anyHand ? "Elini kameraya göster" : two ? "İki elini aç: top bölünür" : holding ? "Tuttun: bırak, fırlasın" : pin ? "Topa yaklaş" : "Parmak uçlarını değdir";
              if (hud.textContent !== t) hud.textContent = t;
              var c = "Top " + balls.length;
              if (countEl.textContent !== c) countEl.textContent = c;
            }

            function tick(now) {
              var dt = Math.min(Math.max((now - last) / 1000, 0.001), 0.05);
              last = now;
              update(dt, now);
              draw(now);
              hudText();
            }

            /* ---------- kamera ve el modeli ---------- */
            var landmarker = null, lastVT = -1, lastTS = 0, running = false;

            function detect() {
              if (!landmarker || v.readyState < 2 || v.currentTime === lastVT) return;
              lastVT = v.currentTime;
              var ts = Math.max(performance.now(), lastTS + 1); lastTS = ts;
              var res;
              try { res = landmarker.detectForVideo(v, ts); } catch (e) { return; }
              var vw = v.videoWidth, vh = v.videoHeight, sc = Math.max(W / vw, H / vh);
              var ox = (vw * sc - W) / 2, oy = (vh * sc - H) / 2, list = [];
              var hands = res.landmarks || [];
              for (var h = 0; h < hands.length; h++) {
                var lm = hands[h], P = [];
                for (var q = 0; q < lm.length; q++) P.push({ x: (1 - lm[q].x) * vw * sc - ox, y: lm[q].y * vh * sc - oy });
                var size = Math.hypot((lm[0].x - lm[9].x) * vw, (lm[0].y - lm[9].y) * vh) || 1;
                var pd = Math.hypot((lm[4].x - lm[8].x) * vw, (lm[4].y - lm[8].y) * vh) / size;
                list.push({ x: (P[4].x + P[8].x) / 2, y: (P[4].y + P[8].y) / 2, pd: pd, lm: P });
              }
              feed(list, performance.now());
            }

            function loop(now) {
              detect();
              tick(now);
              requestAnimationFrame(loop);
            }

            function fail(text) {
              smsg.textContent = text;
              bar.style.display = "none";
              retry.style.display = "block";
            }

            function mkLandmarker(mod, fileset, delegate) {
              return mod.HandLandmarker.createFromOptions(fileset, {
                baseOptions: {
                  modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                  delegate: delegate
                },
                runningMode: "VIDEO", numHands: 2
              });
            }

            async function start() {
              var t0 = performance.now();
              retry.style.display = "none"; bar.style.display = "block";
              smsg.textContent = "Kamera açılıyor...";
              try {
                var stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 480 }, height: { ideal: 360 } }, audio: false });
                v.srcObject = stream;
                await v.play();
                smsg.textContent = "El modeli yükleniyor...";
                var mod = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
                var fileset = await mod.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
                try { landmarker = await mkLandmarker(mod, fileset, "GPU"); }
                catch (e1) { landmarker = await mkLandmarker(mod, fileset, "CPU"); }
              } catch (e) {
                var name = e && e.name ? e.name : "";
                if (name === "NotAllowedError" || name === "SecurityError") fail("Kamera izni verilmedi. Telefon ayarlarından BON için kamerayı aç, sonra tekrar dene.");
                else if (name === "NotFoundError") fail("Ön kamera bulunamadı.");
                else fail("El modeli yüklenemedi. İnternet bağlantını kontrol edip tekrar dene.");
                return;
              }
              try { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function () {}); } catch (e2) {}
              var wait = Math.max(0, 2200 - (performance.now() - t0));
              setTimeout(function () {
                splash.classList.add("off");
                tip.classList.add("on");
                setTimeout(function () { tip.classList.remove("on"); }, 6500);
                setTimeout(function () { splash.style.display = "none"; }, 700);
              }, wait);
              if (!running) { running = true; last = performance.now(); requestAnimationFrame(loop); }
            }

            window.addEventListener("resize", resize);
            $("reset").addEventListener("click", reset);
            retry.addEventListener("click", start);
            resize(); reset();

            if (TEST) {
              window.__bon = { feed: feed, tick: tick, balls: balls, slots: slots, reset: reset, resize: resize, R: function () { return R0; }, size: function () { return [W, H]; } };
              splash.style.display = "none";
            } else {
              start();
            }
          })();
          </script>
          </body>
          </html>
