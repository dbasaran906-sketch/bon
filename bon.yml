      - name: Bağımlılıkları kur
        run: npm install

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Kamera iznini ekle
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$F"
          grep -n "CAMERA" "$F"

      - name: Simge ve açılış ekranını yerleştir
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p $R/mipmap-$d
            cp icons/icon-$s.png $R/mipmap-$d/ic_launcher.png
            cp icons/icon-$s.png $R/mipmap-$d/ic_launcher_round.png
            rm -f $R/mipmap-$d/ic_launcher_foreground.png
          done
          find $R -name 'splash.png' -exec cp icons/splash.png {} \;
          sed -i '/name="AppTheme.NoActionBarLaunch"/a\        <item name="android:windowSplashScreenBackground">#050b14</item>' $R/values/styles.xml
          cat $R/values/styles.xml

      - name: Web dosyalarını Android'e aktar
        run: npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK'yı yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BON.apk
          gh release create "bon-${{ github.run_number }}" BON.apk \
            --title "BON sürüm ${{ github.run_number }}" \
            --notes "Telefonda indirip kurabilirsin."
